[package]
name = "mostlywhat/itera"
version = "0.1.0"
description = "A personal Agile planner."
entrypoint = "run"
private = true

[dependencies]
"shira/php" = "=8.5.10"

[fs]
"/app" = "./deploy"

# HTTP server. PHP's built-in server handles one request at a time.
[[command]]
name = "run"
module = "shira/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080", "/app/router.php"]
