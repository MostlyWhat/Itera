[package]
name = "mostlywhat/itera"
version = "0.1.0"
description = "A personal Agile planner for organizing projects, tasks, and weekly sprints."
repository = "https://github.com/MostlyWhat/Itera"
readme = "./README.md"
entrypoint = "run"
private = true

[dependencies]
"shira/php" = "=8.5.10"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "shira/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
