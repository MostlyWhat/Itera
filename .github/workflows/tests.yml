name: Tests

# Runs on every pull request, on a manual run, and from the Deploy workflow.
# The ruleset on main requires the "Tests" check to pass before a merge.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    # [skip tests] in the last commit message skips this job on a push to main.
    # Pull requests always run the tests, so the required check cannot be skipped.
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message || '', '[skip tests]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      # Installs the pnpm version from "packageManager" in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
