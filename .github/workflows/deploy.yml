name: Deploy

# Runs on a push to main (a merged pull request) and on a manual run.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Commit message markers (GitHub reads the last commit of a push):
#   [skip ci]     GitHub skips the whole workflow (built-in, no tests and no deploy).
#   [skip tests]  Skip the tests. The deploy job still runs.
#   [skip deploy] Run the tests, but do not deploy.

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy to Wasmer Edge
    needs: tests
    # Deploy only from main. The tests must pass, or be skipped with [skip tests].
    if: >-
      ${{
        !cancelled()
        && github.ref == 'refs/heads/main'
        && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
        && !contains(github.event.head_commit.message || '', '[skip deploy]')
      }}
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://itera.wasmer.app

    # Run one production deployment at a time. Do not cancel a running deployment.
    concurrency:
      group: wasmer-production
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, bcmath, pdo_pgsql, pdo_sqlite, zip
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Production dependencies only. Wayfinder is a production dependency,
      # so the frontend build can generate the routes without dev packages.
      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-scripts

      # Package discovery and asset publishing. This script does not run Boost.
      - name: Run production Composer script
        run: composer run build:production

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run build

      - name: Stage deployment package
        run: bash scripts/wasmer/stage.sh

      - name: Setup Wasmer
        uses: wasmerio/setup-wasmer@24b15c95293d23f89c68bd40dac76338f773e924 # v3.1

      # Native PHP runs the migrations one time, before the new version goes live.
      # The script reads the database credentials from the Wasmer app secrets.
      - name: Run database migrations
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: bash scripts/wasmer/migrate.sh

      # The CLI reads the token from WASMER_TOKEN. --bump sets the package version
      # to the latest registry version plus one patch, so each run can publish.
      # Record the live version, so the check below can see the new one.
      - name: Record the live version
        id: live
        run: echo "version=$(bash scripts/wasmer/wait-for-deploy.sh record)" >> "$GITHUB_OUTPUT"

      # --no-wait: the CLI waits on the custom domain, which goes through
      # Cloudflare and times out from the runner. The next step checks the
      # wasmer.app domain instead.
      - name: Deploy to Wasmer Edge
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: wasmer deploy --non-interactive --publish-package --bump --no-wait

      - name: Check the deployed application
        run: bash scripts/wasmer/wait-for-deploy.sh wait "${{ steps.live.outputs.version }}"
